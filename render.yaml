services:
  - type: web
    name: milpagrow-web
    runtime: static
    buildCommand: python3 scripts/preparar_render.py
    staticPublishPath: build
    envVars:
      - key: MILPAGROW_API_URL
        sync: false
      - key: MILPAGROW_FIREBASE_API_KEY
        sync: false
      - key: MILPAGROW_FIREBASE_PROJECT_ID
        sync: false
      - key: MILPAGROW_REGISTRATION_API_URL
        sync: false
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /config.js
        name: Cache-Control
        value: no-store
      - path: /admin.html
        name: Cache-Control
        value: no-store
      - path: /acceso.html
        name: Cache-Control
        value: no-store
  - type: web
    name: milpagrow-web-registration
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: nereon-milpagrow
      - key: MILPAGROW_FIREBASE_PROJECT_ID
        value: nereon-milpagrow
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: MilpaGrow
      - key: WEBSITE_REGISTRATION_SECRET
        generateValue: true
      - key: WEBSITE_ALLOWED_ORIGINS
        value: https://milpagrow-web.onrender.com
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: WEBSITE_APK_URL
        sync: false
      - key: WEBSITE_APK_AUTH_TOKEN
        sync: false
      - key: WEBSITE_APK_VERSION
        sync: false
